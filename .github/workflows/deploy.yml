name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feat/aliyun-online-testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Step 1: data pipeline (Python). Isolated so a data failure surfaces here,
  # not buried in the site build.
  data:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build data files
        run: python scripts/build_data.py

      - name: Validate agent data contract
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/test_research_data.py
          python scripts/validate_agent_data.py

      - name: Validate data outputs
        run: |
          python - <<'PY'
          import json, os, sys
          for f in ("qce.json", "tqe.json", "stats.json"):
              p = os.path.join("public", "data", f)
              assert os.path.exists(p), f"missing {p}"
              d = json.load(open(p, encoding="utf-8"))
              print(f"{f}: ok ({os.path.getsize(p)} bytes)")
          q = json.load(open("public/data/qce.json", encoding="utf-8"))
          t = json.load(open("public/data/tqe.json", encoding="utf-8"))
          assert q["count"] > 0 and t["count"] > 0, "empty dataset"
          print(f"records: qce={q['count']} tqe={t['count']}")
          PY

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: public/data
          retention-days: 1

  # Step 2: site build (Node). Downloads the data artifact, runs pnpm build,
  # and uploads the Pages artifact.
  build:
    needs: data
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://rachelteacher.online/paper4qi' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend and backend contracts
        run: |
          node scripts/test-site-worker.mjs
          node scripts/test_workspace_api.mjs
          node scripts/test_chat_api.mjs
          node scripts/test_api_client.mjs
          node scripts/test_workspace_ui.mjs
          node scripts/test_research_chat_ui.mjs
          node scripts/test_navigation.mjs
          node scripts/test_server.mjs --http

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: site-data
          path: public/data

      - name: Build site
        run: pnpm build

      - name: Validate built navigation
        run: node scripts/test_navigation.mjs --built

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate published data and curated guides
        run: python scripts/validate_agent_data.py --site-dir dist

      - name: Verify public backend connection
        run: |
          node --input-type=module - <<'JS'
          const base = process.env.PUBLIC_API_BASE_URL.replace(/\/+$/, '');
          const response = await fetch(base + '/api/status', {
            headers: { Origin: 'https://xiaoshecode.github.io' },
            redirect: 'error', signal: AbortSignal.timeout(20000),
          });
          if (!response.ok) throw new Error('The public research backend is unavailable');
          const status = await response.json();
          if (!status.ready || status.mode !== 'online' || status.auth_mode !== 'password'
              || status.can_edit !== false
              || response.headers.get('Access-Control-Allow-Origin') !== 'https://xiaoshecode.github.io') {
            throw new Error('Backend readiness, public-read access or frontend CORS did not pass');
          }
          console.log('Public backend ready; anonymous writes denied; frontend CORS verified.');
          JS

      - name: Verify built output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/data/qce.json || { echo "dist/data/qce.json missing"; exit 1; }
          test -f dist/agents/index.html || { echo "dist/agents/index.html missing"; exit 1; }
          echo "dist pages:" && find dist -name "*.html" | sort
          echo "data size:" && du -sh dist/data

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Step 3: deploy to Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
