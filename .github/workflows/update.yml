name: Weekly data update

on:
  schedule:
    # Mondays 03:14 UTC. GitHub may delay scheduled runs, so the fetch window
    # always overlaps the previous run by a couple of days.
    - cron: '14 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Exits 0 with ::warning:: annotations when a source is unreachable, so the
      # job never fails on a transient API outage.
      - name: Update data sources
        run: python scripts/update_data.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data_src)" ]; then
            echo "no data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_src
          git commit -m "data: weekly update $(date -u +%F)"
          git push
